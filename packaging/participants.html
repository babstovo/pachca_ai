<style>
:host{color-scheme:dark;font:14px/1.45 "Segoe UI",Arial,sans-serif;color:#e5e7f0;background:#1d1e22;--surface:#1e1f23;--field:#292b32;--line:#323644;--muted:#a4a9bd;--accent:#4854f9}
*{box-sizing:border-box}:host{min-height:0;flex:1;display:grid;grid-template-columns:clamp(152px,29%,240px) minmax(0,1fr)}button,input,textarea{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}button:disabled{opacity:.48;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #979fff;outline-offset:2px}
aside{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:18px 10px 10px}h1,h2,p{margin:0}h1{font-size:17px;margin:0 8px 14px;display:flex;align-items:center;gap:8px}#count{font-size:13px;color:var(--muted);font-weight:500}
.search{display:flex;align-items:center;gap:9px;margin-bottom:12px;padding:0 10px;height:36px;flex:none;background:var(--field);border:1px solid var(--line);border-radius:6px}.glass{width:14px;height:14px;border:1.6px solid var(--muted);border-radius:50%;position:relative;flex:none}.glass:after{content:"";position:absolute;right:-4px;bottom:-2px;width:6px;border-top:1.6px solid var(--muted);transform:rotate(45deg)}
.search input{background:none;border:none;width:100%;min-width:0}.search:focus-within{border-color:#929aff}.search input:focus-visible{outline:none}
#people{overflow:auto;min-height:0;flex:1}.person{width:100%;display:flex;gap:10px;align-items:center;text-align:left;padding:6px 8px;border-radius:5px;font-weight:600}.person:hover{background:#292b32}.person[aria-current=true]{background:var(--accent);color:white}.person span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.avatar{width:27px;height:27px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:10px;font-weight:700;color:white;background:#5265a8}aside footer{border-top:1px solid var(--line);padding:10px 0 0;margin-top:8px}.secondary,.primary{padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--field);font-weight:600}.secondary:hover{background:#333640}.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#5661ff}
#rescan{width:100%;text-align:left}.empty{padding:14px;color:var(--muted)}main{min-height:0;display:flex;flex-direction:column}header{padding:16px 22px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);min-height:70px}header .avatar{width:38px;height:38px;font-size:14px}h2{font-size:18px;line-height:1.2;overflow-wrap:anywhere}header .secondary{margin-left:auto;flex:none}
#body{overflow:auto;flex:1;padding:0 24px}section{padding:16px 0;border-bottom:1px solid var(--line)}section label{display:block;font-size:13px;font-weight:600;color:#adb3c8;margin-bottom:6px}.value{white-space:pre-wrap;overflow-wrap:anywhere}.hint{color:var(--muted);font-size:13px;margin:6px 0 10px}.field{width:100%;display:block;min-height:66px;resize:vertical;padding:9px 11px;border:1px solid #424758;border-radius:6px;background:#22242d}
#evidence{padding:15px 0;color:var(--muted);font-size:12px}main footer{padding:12px 22px;border-top:1px solid var(--line);display:flex;align-items:center;gap:8px;min-height:50px}#status{flex:1;color:var(--muted);font-size:12px}#status.error{color:#ffb2ad}dialog{background:#25262d;color:inherit;border:1px solid #414455;border-radius:9px;padding:20px;max-width:340px}dialog::backdrop{background:#101117a8}dialog p{margin-bottom:16px}[hidden]{display:none!important}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#404456;border-radius:5px}
@media(max-width:900px){header{flex-wrap:wrap;padding:12px;gap:8px}header .secondary{font-size:12px}#body{padding:0 14px}main footer{flex-wrap:wrap;padding:9px 12px}}
.roster-heading{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:4px 8px;margin:0 4px 12px}.roster-heading h1{margin:0}.roster-heading button{padding:4px 8px;font-size:12px}
.select-all,.depth{display:flex;align-items:center;gap:8px}label.person{cursor:pointer}label.person:has(:checked){background:var(--accent);color:white}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px;margin:0;flex:none;cursor:pointer}
.select-all{padding:0 4px 9px;font-size:12px;color:var(--muted)}.depth{justify-content:space-between;font-size:12px;margin-bottom:9px}
#depth{width:66px;padding:4px 5px;background:var(--field);border:1px solid var(--line);border-radius:5px}#rescan{text-align:center}
#analysis-note{font-size:12px;color:var(--muted);padding-top:14px}blockquote{margin:8px 0;padding-left:12px;border-left:2px solid #545d8c;white-space:pre-wrap;overflow-wrap:anywhere}blockquote small{display:block;color:var(--muted);margin-top:3px}
</style>
<aside><div class="roster-heading"><h1>Участники <span id="count"></span></h1><button id="choose" class="secondary" aria-pressed="false">Выбрать</button></div>
<label class="search"><span class="glass" aria-hidden="true"></span><input id="search" type="search" placeholder="Поиск в Пачке" aria-label="Поиск по имени" maxlength="200" autocomplete="off"></label>
<div id="lookup-error" hidden><p class="empty" role="status" id="lookup-message"></p><button type="button" class="secondary" id="retry">Повторить загрузку</button></div>
<label id="select-all" class="select-all" hidden><input id="all" type="checkbox" disabled><span id="all-label">Выбрать всех</span></label>
<nav id="people" aria-label="Участники"></nav><footer>
<label id="depth-field" class="depth" for="depth" hidden title="От 1 до 5 000. Учитываются сообщения участника и ваши адресные ответы в последних 5 000 сообщениях пространства.">Последних сообщений на человека<input id="depth" type="number" min="1" max="5000" step="1" value="100" required></label>
<button id="rescan" class="primary" disabled>Обновить</button></footer></aside>
<main><header><span id="avatar" class="avatar" hidden></span><h2 id="name">Карточка участника</h2><button id="edit" class="secondary" hidden>Редактировать</button></header>
<div id="body"><p id="blank" class="empty">Загружаем участников…</p><p id="analysis-note" hidden></p><div id="fields"></div><p id="evidence"></p><div id="examples"></div></div>
<footer><span id="status" role="status"></span><button id="cancel" class="secondary" hidden>Отмена</button><button id="save" class="primary" hidden>Сохранить</button></footer></main>
<dialog id="discard"><p>Закрыть карточку без сохранения изменений?</p><button id="stay" class="secondary" autofocus>Продолжить правку</button> <button id="leave" class="primary">Не сохранять</button></dialog>
