<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пачка · Codex</title>
<style>
:root{color-scheme:dark;font:14px "Segoe UI",sans-serif;background:#1e1f23;color:#e5e7f0}
body{margin:0;display:flex;flex-direction:column;height:100dvh}
#chat{flex:1;min-height:0;display:flex} openai-chatkit{width:100%;height:100%;display:block}
#status{padding:8px 12px;margin:0} #status:empty{display:none}
button{align-self:flex-start;margin:0 12px 12px}
[hidden]{display:none!important}button,textarea,input{font:inherit}
button{cursor:pointer;color:inherit;background:#30313a;border:1px solid #4a4c57;border-radius:6px;padding:6px 11px}
button:disabled{opacity:.55;cursor:default}
#gate{flex:1;display:grid;place-content:center;text-align:center;padding:16px;gap:10px}
#connect{justify-self:center;margin:0;background:#4b55ed;border-color:#4b55ed}
#connection{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
#local{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px;gap:6px}
#rows{flex:1;overflow:auto}article{margin:0 0 10px;padding:8px;background:#292a31;border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere}
article small{display:block;color:#b9bbcf}article img{max-width:100%;max-height:120px}
#local button{margin:3px}#draft{box-sizing:border-box;width:100%;resize:vertical;min-height:48px;color:inherit;background:#25262c;border:1px solid #484955;border-radius:6px;padding:8px}#files{max-width:100%;font-size:12px}
</style>
</head>
<body>
<p id="status" role="status">Загрузка ChatKit…</p>
<button id="retry" hidden>Загрузить ChatKit снова</button>
<section id="gate" hidden><p id="connection" role="status"></p><button id="connect">Подключить агента</button></section>
<div id="chat"></div>
<section id="local" hidden aria-label="Локальный чат"><div id="rows" role="log"></div>
<p id="localReply" hidden></p><form id="localForm"><textarea id="draft" maxlength="16000" placeholder="Написать Codex" aria-label="Сообщение агенту"></textarea>
<input id="files" type="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,image/bmp" aria-label="Приложить изображения"><button id="send">Отправить</button></form></section>
<script src="panel.js"></script>
</body></html>
